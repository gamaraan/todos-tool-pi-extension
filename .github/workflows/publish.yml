name: publish

# Publishes @gamaraan/todos-tool to npm when a v* tag is pushed. The verify job
# re-runs the full gate (typecheck, unit tests, package contents, tag
# invariants) and the publish job releases with npm provenance (id-token).
# Tests are self-contained bun tests against the published @earendil-works/pi-*
# devDependency packages, so no pi-mono sibling checkout is needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # setup-bun caches the bun executable by default; disable it (see
          # zizmor cache-poisoning audit) - the verify job must be hermetic.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Verify package contents
        run: bun run verify:package

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Verify tag is on the protected default branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not reachable from origin/main" >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # setup-node v5+ auto-caches npm by default; disable it (see
          # zizmor cache-poisoning audit) - the verify job must be hermetic.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
